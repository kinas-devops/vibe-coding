<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mastermind Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎯 Mastermind</h1>
  <div id="board"></div>
  <div id="controls">
    <div id="color-picker">
      <button class="color" data-color="red"></button>
      <button class="color" data-color="blue"></button>
      <button class="color" data-color="green"></button>
      <button class="color" data-color="yellow"></button>
      <button class="color" data-color="purple"></button>
      <button class="color" data-color="orange"></button>
    </div>
    <button id="submit">Submit Guess</button>
	<div id="preview" class="row"></div>
	<button id="clear">Clear Guess</button>
  </div>
  <label for="timeLimit">⏱ Time Limit (seconds):</label>
  <input type="number" id="timeLimit" value="60" min="10" max="300">
  <span id="timerDisplay">Time left: 60s</span>
  <button id="restart">🔄 Play Again</button>
  <script src="script.js"></script>
</body>
</html>
